# Every push and pull request: type check, interface tests (including the WCAG contrast check),
# Rust tests, end-to-end tests against the built app, and the watcher's footprint against its
# design-document budget (15 MB, 0.2% CPU).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install
        run: npm ci

      - name: Type check and build the interface
        run: npm run build

      - name: Interface tests and contrast check
        run: npm test

      - name: Rust tests
        run: cargo test --workspace

      - name: Build the app and test tools
        run: |
          npx tauri build --no-bundle
          cargo build --release -p framewise-checks --example footprint_watch --example test_scene

      - name: WebView2 runtime (the window needs it)
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $v = $keys | ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          if ($v) { "WebView2 runtime $v is installed." } else {
            "Installing the WebView2 runtime (Microsoft's Evergreen bootstrapper)..."
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
            Start-Process "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList '/silent', '/install' -Wait
            $v = $keys | ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ } | Select-Object -First 1
            "WebView2 runtime now: $v"
          }

      - name: End-to-end tests (Playwright, real app)
        run: npm run e2e

      - name: Keep end-to-end results if they failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore

      - name: Watcher footprint (2 minutes, budget 15 MB / 0.2% CPU)
        shell: pwsh
        run: |
          $w = Start-Process target\release\framewise.exe -ArgumentList '--watcher' -PassThru
          Start-Sleep 5
          if ($w.HasExited) { throw "The watcher exited straight away (code $($w.ExitCode))." }
          & target\release\examples\footprint_watch.exe $w.Id 120 15 0.2
          $code = $LASTEXITCODE
          & target\release\framewise.exe --stop-watcher
          exit $code
