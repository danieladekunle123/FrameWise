# Every push and pull request: type check, interface tests (including the WCAG contrast check),
# Rust tests, end-to-end tests against the built app, and the watcher's footprint against its
# design-document budget (15 MB, 0.2% CPU).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install
        run: npm ci

      - name: Type check and build the interface
        run: npm run build

      - name: Interface tests and contrast check
        run: npm test

      - name: Rust tests
        run: cargo test --workspace

      - name: Build the app and test tools
        run: |
          npx tauri build --no-bundle
          cargo build --release -p framewise-checks --example footprint_watch --example test_scene

      - name: End-to-end tests (Playwright, real app)
        run: npm run e2e

      - name: Keep end-to-end results if they failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore

      - name: Watcher footprint (2 minutes, budget 15 MB / 0.2% CPU)
        shell: pwsh
        run: |
          $w = Start-Process target\release\framewise.exe -ArgumentList '--watcher' -PassThru
          Start-Sleep 5
          if ($w.HasExited) { throw "The watcher exited straight away (code $($w.ExitCode))." }
          & target\release\examples\footprint_watch.exe $w.Id 120 15 0.2
          $code = $LASTEXITCODE
          & target\release\framewise.exe --stop-watcher
          exit $code
