[workspace]
resolver = "2"
members = ["crates/framewise-checks", "src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
authors = ["Daniel"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Small, lean binaries: the footprint is a feature.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
